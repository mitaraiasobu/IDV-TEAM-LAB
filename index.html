     ・キャラの顔の画像は、大会のページ（window.LAB_ASSET_BASE）のものを読む。

  #notice .err { background: #3a2a10; border: 1px solid #e0a030; color: #ffd28a; }
  main { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 8px 16px 12px; align-items: stretch; }

  .tag.req .nm { color: var(--gold); font-weight: 700; }
  .tag.bad { border-color: #ff2b45; animation: blinkTag 4s step-end infinite; }                    /* 使用禁止：枠線だけ、ゆっくり点滅（フェードなし） */

  .tag .x { position: absolute; right: -6px; top: -7px; width: 18px; height: 18px; line-height: 16px; border-radius: 50%; background: #000; color: #fff; border: 1px solid #888;
            font-size: 11px; padding: 0; cursor: pointer; display: none; }

          [["bs", 4], ["bh", 1], ["ps", 4], ["ph", 1]].forEach(function (x) { var td = el("td"); td.appendChild(numSel(base + x[0], x[1], 0, 8)); tr2.appendChild(td); });
          var tg = el("td"); tg.appendChild(chk(base + "g", k !== "1", "あり")); tr2.appendChild(tg);
          t2.appendChild(tr2);
        });
        s5.appendChild(t2);
      }
    }
    box.appendChild(s5);
  }
  function rulesSig() { var R = rules(); return JSON.stringify([FREE, ruleNum(R.n, 3, 1, 8), !!R.detail]); }
  function fillLb() {
    var z = $("lbzone"); if (!z) return;
    z.textContent = "";
    var ids = Object.keys(obj(rules().lb)).map(Number).filter(function (id) { return CH[id]; });
    z.classList.toggle("empty", !ids.length);
    ids.forEach(function (id) {
      var tg = makeTag(CH[id], { onRemove: function () { var o = {}; o["rules/lb/" + id] = null; write(o); } });
      attachTag(tg, CH[id], { kind: "blk", spec: "rule:lb" });
      z.appendChild(tg);
    });
  }
  function afterMetaChange() {                                                        // ルールや選手の名前が変わった：タブ・名札置き場・枠を、作り直す（入力中の欄は、作り直さない）
    if (cur.tab === "rules") { buildTabs(); buildPalette(); if (RULEBUILT !== rulesSig()) buildWork(); fill(); } else buildAll();
  }
  function metaChanged() {
    if (FREE && RAWMETA && applyMeta()) { if (isRoundTab() && !curRound()) cur = { tab: "rules", set: "1" }; afterMetaChange(); return true; }
    return false;
  }

  function buildWork() {
    var w = $("work"); w.textContent = "";
    if (cur.tab === "rules") { RULEBUILT = rulesSig(); buildRules(w); return; }
    if (cur.tab === "fav") {
      w.appendChild(el("div", "hint", "選手ごとの得意キャラです。名札を選手の枠に入れてください（同じ枠に同じキャラは入りません。選手が違えば、同じキャラでも入れられます）。"));
      var g = el("div", "players");
      if (!PLAYERS.length) w.appendChild(el("div", "empty-msg", FREE ? "「ルール設定」のタブで、選手の名前を入れると、ここに並びます。" : "選手が登録されると、ここに並びます。"));
      PLAYERS.forEach(function (p) {
        var b = el("div", "box");
        var h = el("h4", "", p.n); b.appendChild(h);
        var d = el("div", "drop"); d.setAttribute("data-drop", "fav:" + p.id); d.setAttribute("data-hint", "ここに名札を入れる");
        d.addEventListener("click", function () { onDropClick("fav:" + p.id, d); });
        b.appendChild(d); g.appendChild(b);
      });
      w.appendChild(g);
      return;
    }
    var s = curSet();
    if (!s) { w.appendChild(el("div", "empty-msg", "このラウンドの情報がありません。")); return; }
    var r = curRound();
    w.appendChild(el("div", "hint", r.name + "（" + r.fmt + "）／" + s.label + "　サバイバー目線：BAN（ハンター）" + s.ban.h + "・PICK（サバイバー）" + s.pick.s
      + "　／　ハンター目線：BAN（サバイバー）" + s.ban.s + "・PICK（ハンター）" + s.pick.h + "。GLOBAL BANは、前のセットで使ったキャラが、自動で入ります。"));
    var cs = el("div"); cs.id = "corners";
    [["s", "サバイバー目線"], ["h", "ハンター目線"]].forEach(function (pair) {         // 中央がサバイバー目線、右がハンター目線
      var v = pair[0], c = el("div", "corner " + v); c.appendChild(el("h3", "", pair[1]));
      [["ban", "BAN"], ["pick", "PICK"], ["gb", editableGb() ? "GLOBAL BAN（自動。手で直せます）" : "GLOBAL BAN（自動）"]].forEach(function (bk) {
        var b = bk[0], blk = el("div", "blk " + b);
        var h = el("h4", "", bk[1]);
        if (b !== "gb") h.appendChild(el("small", "", "（" + (blockFaction(v, b) === "h" ? "ハンター" : "サバイバー") + "のキャラ）"));
        else h.appendChild(el("small", "", "（" + (v === "h" ? "ハンター" : "サバイバー") + "のキャラ）"));
        var cnt = el("span", "cnt"); cnt.id = "cnt-" + v + "-" + b; h.appendChild(cnt); blk.appendChild(h);
        var d = el("div", "drop");
        d.id = "blk-" + v + "-" + b;
        if (b === "gb") {
          d.setAttribute("data-hint", (s.gbOn || {})[v] ? "前のセットで使ったキャラが、ここに入ります" : "このセットはGLOBAL BANなし");
          if (editableGb()) { d.setAttribute("data-drop", "gbx:" + v); d.addEventListener("click", (function (spec, node) { return function () { onDropClick(spec, node); }; })("gbx:" + v, d)); }
        }
        else {
          var cap = capOf(s, v, b);
          if (cap === 0) { d.classList.add("off"); d.textContent = (b === "ban" ? "BAN" : "PICK") + "はできないセットです"; }
          else { d.setAttribute("data-drop", "set:" + v + ":" + b); d.setAttribute("data-hint", "ここに名札を入れる"); d.addEventListener("click", (function (spec, node) { return function () { onDropClick(spec, node); }; })("set:" + v + ":" + b, d)); }
        }
        blk.appendChild(d); c.appendChild(blk);
      });
      cs.appendChild(c);
    });
    w.appendChild(cs);
    var memo = el("div"); memo.id = "memo";
    memo.appendChild(el("h4", "", "メモ（戦略・メモなど。みんなで同時に書けます）"));
    var ta = el("textarea"); ta.maxLength = 2000; ta.placeholder = "自由に書いてください";
    var timer = null, sid = setId();
    ta.addEventListener("input", function () {
      clearTimeout(timer);
      timer = setTimeout(function () { var o = {}; o["sets/" + sid + "/memo"] = ta.value || null; writeQuiet(o); }, 500);
    });
    ta.id = "memoText";
    memo.appendChild(ta); w.appendChild(memo);
  }
  function fill() {
    if (!META) return;
    fillPalette();
    if (cur.tab === "rules") {
      if (RULEBUILT !== rulesSig()) buildWork();
      RCTL.forEach(function (f) { f(); });
      fillLb();
    } else if (cur.tab === "fav") {
      PLAYERS.forEach(function (p) {
        var d = document.querySelector('[data-drop="fav:' + p.id + '"]');
        if (!d) return;
        d.textContent = "";
        var ids = Object.keys(obj(obj(STATE.fav)[p.id])).map(Number).filter(function (id) { return CH[id]; });
        ids.sort(function (a, b) { return (CH[a].f === CH[b].f ? 0 : CH[a].f === "h" ? -1 : 1) || a - b; });
        d.classList.toggle("empty", !ids.length);
        ids.forEach(function (id) {
          var t = makeTag(CH[id], { onRemove: function () { var o = {}; o["fav/" + p.id + "/" + id] = null; write(o); } });
          if (sel && sel.id === id && sel.from.spec === "fav:" + p.id) t.classList.add("sel");
          attachTag(t, CH[id], { kind: "blk", spec: "fav:" + p.id });
          d.appendChild(t);
        });
      });
    } else {
      var s = curSet();
      if (s) {
        var req = reqIds(), lb = lbIds(), st = setState(), rd = curRound();
        var gbv = {};
        ["s", "h"].forEach(function (f) { gbv[f] = {}; globalList(f, rd, s).forEach(function (id) { gbv[f][id] = true; }); });
        var hard = {};                                                                  // ぜったい必須のキャラ（組の必須ではないもの）
        ["h", "s"].forEach(function (f) { ((s.req && s.req[f]) || []).forEach(function (r) { if (!r.g) hard[r.id] = true; }); });
        [["s"], ["h"]].forEach(function (fa) {
          var f = fa[0];
          ["ban", "pick"].forEach(function (b) {
            var d = $("blk-" + f + "-" + b);
            if (!d) return;
            var cap = capOf(s, f, b);
            if (cap === 0) return;                                                      // できない枠：そのまま
            var want = blockFaction(f, b);                                              // この枠に入るキャラの陣営
            var auto = Object.keys(b === "pick" ? hard : lb).map(Number).filter(function (id) { return CH[id] && CH[id].f === want; });
            var manual = Object.keys(obj(obj(st[f])[b])).map(Number).filter(function (id) { return CH[id] && auto.indexOf(id) < 0; });
            var counted = manual.length + (b === "pick" ? auto.length : 0);               // ローカルBANは、BANの人数には、数えない（別のカウント）
            d.textContent = "";
            d.classList.toggle("empty", !manual.length && !auto.length);
            d.classList.toggle("exact", counted === cap);                                 // 人数がピッタリ揃った：枠線に、青いライン
            auto.forEach(function (id) { d.appendChild(makeTag(CH[id], { locked: true, req: !!req[id], bad: b === "pick" && !!gbv[f][id] })); });      // 自動で入ったもの（外せない）
            manual.forEach(function (id) {
              var spec = "set:" + f + ":" + b;
              var isBad = b === "pick" ? !!gbv[f][id] : !!lb[id];                // PICKは使えないキャラだと、警告
              var t = makeTag(CH[id], { req: !!req[id], bad: isBad, onRemove: function () { var o = {}; o[dropPath(spec) + "/" + id] = null; write(o); } });
              if (sel && sel.id === id && sel.from.spec === spec) t.classList.add("sel");
              attachTag(t, CH[id], { kind: "blk", spec: spec });
              d.appendChild(t);
            });
            var c = $("cnt-" + f + "-" + b);
            if (c) { c.textContent = counted + " / " + cap + (b === "ban" && auto.length ? "（＋ローカルBAN " + auto.length + "）" : ""); c.className = "cnt" + (counted > cap ? " over" : ""); }
          });
          var g = $("blk-" + f + "-gb");
          if (g) {
            g.textContent = "";
            var gl = globalList(f, rd, s);                                              // 前のセットで使ったキャラ（ローカルBANは、BANの枠に入るので、ここには出さない）
            g.classList.toggle("empty", !gl.length);
            gl.forEach(function (id) {
              var o2 = { locked: true };
              if (editableGb()) o2.onRemove = function () {
                var o = {}, auto = globalBase(f, rd, s).indexOf(id) >= 0;
                o["rules/gbx/" + rd.no + "_" + s.k + "/" + f + "/" + id] = auto ? 0 : null; write(o);
              };
              g.appendChild(makeTag(CH[id], o2));
            });
          }
        });
        var ta = $("memoText");
        if (ta) { var v = String(obj(st).memo || ""); if (document.activeElement !== ta && ta.value !== v) ta.value = v; }
      }
    }
    showNotice();
  }
  function showNotice() {
    var n = $("notice"); n.textContent = "";
    var flashMsg = n.getAttribute("data-flash");
    if (flashMsg) n.appendChild(el("div", "bar err", flashMsg));
    if (writeFailed) n.appendChild(el("div", "bar err", "保存できませんでした（通信が切れている、または Firebase のルールの設定が違います）。管理者に伝えてください。"));
    var fresh = newIds();
    if (fresh.length) {                                                                // 知らない端末が、開きました
      var bar = el("div", "bar newid");
      bar.appendChild(el("span", "", "⚠ 知らない端末のアクセスがあります：" + fresh.slice(0, 4).map(function (h) { return (h.n || "?") + "（ID " + h.cid.slice(0, 6) + "）" + fmtTime(h.t); }).join("、")
        + (fresh.length > 4 ? " ほか" : "") + "。チームの人でなければ、すぐに、チームの管理者に知らせてください。"));
      var ok = el("button", "", "確認した");
      ok.type = "button";
      ok.addEventListener("click", function () { var s = seenList(); fresh.forEach(function (h) { if (s.indexOf(h.cid) < 0) s.push(h.cid); }); saveSeen(s); showNotice(); });
      bar.appendChild(ok);
      var hb = el("button", "", "履歴を見る"); hb.type = "button"; hb.addEventListener("click", openHist); bar.appendChild(hb);
      n.appendChild(bar);
    }
  }

  // ───────── 読み込み ─────────
  function onMeta(m) {
    if (!m) { if (!META) setStatus("データを待っています…（BOTが準備すると表示されます）", ""); return; }
    RAWMETA = m;
    applyMeta();
    $("ttl").textContent = "🧪 IDV TEAM LAB｜" + (m.team || "");
    $("sub").textContent = m.tour || "";
    document.title = "IDV TEAM LAB｜" + (m.team || "");
    if (FIRST_META) { FIRST_META = false; if (FREE && !savedTab) cur = { tab: "rules", set: "1" }; }              // 大会BOTを使わないチームは、最初は、ルール設定から
    if (isRoundTab() && !curRound()) cur = { tab: FREE ? "rules" : "fav", set: "1" };
    if (isRoundTab() && !curSet()) cur.set = (curRound().sets[0] || {}).k;
    var memoFocused = document.activeElement && document.activeElement.id === "memoText";
    if (memoFocused) { buildTabs(); buildPalette(); fill(); } else buildAll();
  }
  var savedTab = false;
  try { var saved = JSON.parse(sessionStorage.getItem("lab_tab_" + ID) || "null"); if (saved && saved.tab) { cur = saved; savedTab = true; } } catch (e) { /* 無視 */ }
  function getJson(u) { return fetch(u, { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); }
  Promise.all([getJson(ASSET + "face_positions.json"), getJson(ASSET + "assets/face_positions.json")]).then(function (r) {
    FACES = (r[0] && r[0].faces) || (r[1] && r[1].faces) || {};
  }).then(boot);
})();
</script>
