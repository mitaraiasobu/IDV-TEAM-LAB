<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https://mitaraiasobu.github.io data:; connect-src https://idv-team-lab-default-rtdb.asia-southeast1.firebasedatabase.app https://mitaraiasobu.github.io; base-uri 'none'; form-action 'none'">

<title>IDV TEAM LAB</title>
<!-- IDV TEAM LAB：チームだけで使う、試合前の作戦ボード（みんなで同時に編集できる）。大会BOTとは別のサイト。
     ・URLの # のあとの文字（チームごとのランダムな24文字）を知っている人だけが、このチームの場所を開ける。
     ・開くには、チームで決めた「パスワード」が要る。パスワードは、ブラウザの中だけで使い、どこにも送らない・保存しない（GitHubにも、Firebaseにも、入らない）。
     ・作戦の中身は、パスワードから作った鍵で、ブラウザの中で暗号化（AES-256-GCM）してから、Firebaseに送る。Firebaseに置かれるのは暗号文だけなので、パスワードを知らない人は、読めない。
     ・履歴（訪問・編集）は、追記だけで、消せない・書き換えられない（Firebaseのルール）。端末ごとのID（ブラウザに作る）が入るので、知らない端末が開くと、お知らせが出る。
     ・パスワードは、最初に1回だけ決める（英大文字・小文字・数字、10〜20文字）。あとから変えることはできない。
     ・キャラの顔の画像は、大会のページ（window.LAB_ASSET_BASE）のものを読む。
     ・中身（キャラ・名札・ドラッグ・職業の並び替え・スマホの回転）は、大会BOTの作戦ボードと同じ。 -->
<style>
  :root { --bg0: #05070b; --fg0: #f2f6ff; --ac: #22d3ee; --ac-on: #03121a;                          /* LABごとに変えられる3色：背景・文字・サブカラー */
          --bg: var(--bg0); --text: var(--fg0);
          --panel: color-mix(in srgb, var(--bg0) 91%, var(--fg0)); --panel2: color-mix(in srgb, var(--bg0) 83%, var(--fg0));
          --line: color-mix(in srgb, var(--bg0) 70%, var(--fg0)); --sub: color-mix(in srgb, var(--fg0) 62%, var(--bg0));
          --h: #d8334a; --h2: #7d1b29; --s: #2f7be0; --s2: #173d73; --gold: #ffd23f; --ok: #3ecf8e; }   /* ハンターの赤・サバイバーの青は、固定 */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif; }
  #stage { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: flex; flex-direction: column; transform-origin: 0 0; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding: 10px 16px 6px; }
  header h1 { margin: 0; font-size: 20px; }
  header .sub { color: var(--sub); font-size: 13px; }
  #status { margin-left: auto; font-size: 12px; color: var(--sub); }
  #status.ok { color: var(--ok); } #status.ng { color: #ff7a85; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 16px; }
  nav button { appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 7px 14px; border-radius: 8px 8px 0 0;
               font: inherit; font-size: 14px; cursor: pointer; }
  nav button.on { background: var(--panel2); border-color: #6f84ad; border-bottom-color: var(--panel2); font-weight: 700; }
  #tabs2 button { font-size: 13px; padding: 5px 12px; }
  #notice { margin: 4px 16px; font-size: 13px; }
  #notice .bar { padding: 6px 10px; border-radius: 6px; margin-bottom: 4px; }
  #notice .bad { background: #4a1219; border: 1px solid #ff3b52; color: #ffb3bb; animation: blink 1s steps(2, start) infinite; }
  #notice .req { background: #4a3d0a; border: 1px solid var(--gold); color: #ffe48a; }
  #notice .err { background: #3a2a10; border: 1px solid #e0a030; color: #ffd28a; }
  main { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 8px 16px 12px; align-items: stretch; }
  #pal { flex: 0 0 330px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  #pal.drop-ok { outline: 2px dashed var(--sub); }
  #pal h3 { margin: 0 2px; font-size: 13px; color: var(--sub); flex: none; }
  #pal input { width: 100%; flex: none; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 13px; }
  #pal .hint { flex: none; margin: 0; }
  .palbox { flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; }     /* ハンターの名札置き場と、サバイバーの名札置き場は、別々にスクロール */
  .palbox.h { border-top: 2px solid var(--h); } .palbox.s { border-top: 2px solid var(--s); }
  .palopt { flex: none; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sub); margin: 0 2px; cursor: pointer; user-select: none; }
  #pal .palopt input { width: auto; flex: none; padding: 0; accent-color: var(--s); }
  .palopt { white-space: nowrap; }
  .rolehd { margin: 6px 2px 3px; font-size: 12px; font-weight: 700; color: #9cc4ff; border-bottom: 1px solid var(--s2); }
  .rolehd:first-child { margin-top: 0; }
  #work { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; padding-bottom: 20px; }
  .grid { display: flex; flex-wrap: wrap; gap: 5px; }
  /* 名札：顔 + 名前 を、枠で囲む。ハンターは赤、サバイバーは青 */
  .tag { width: 66px; border: 2px solid; border-radius: 8px; padding: 3px 2px 2px; text-align: center; cursor: grab; user-select: none; -webkit-user-select: none;
         touch-action: pan-y; position: relative; background: var(--panel2); }
  .tag.h { border-color: var(--h); background: linear-gradient(180deg, #3a1219, var(--h2)); }
  .tag.s { border-color: var(--s); background: linear-gradient(180deg, #11274a, var(--s2)); }
  .tag .face { width: 56px; height: 56px; margin: 0 auto; border-radius: 6px; background-repeat: no-repeat; background-color: rgba(0,0,0,.35);
               display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .tag .nm { font-size: 10.5px; line-height: 1.15; margin-top: 2px; word-break: break-all; min-height: 24px; display: flex; align-items: center; justify-content: center; }
  .tag.sel { outline: 3px solid #fff; }
  .tag.req { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold), 0 0 12px 2px rgba(255,210,63,.75); }
  .tag.req .nm { color: var(--gold); font-weight: 700; }
  .tag.bad { border-color: #ff2b45; animation: blinkTag 4s step-end infinite; }                    /* 使用禁止：枠線だけ、ゆっくり点滅（フェードなし） */
  .tag.locked { cursor: default; opacity: .92; }
  .tag.dim { opacity: .35; }
  .tag .x { position: absolute; right: -6px; top: -7px; width: 18px; height: 18px; line-height: 16px; border-radius: 50%; background: #000; color: #fff; border: 1px solid #888;
            font-size: 11px; padding: 0; cursor: pointer; display: none; }
  .tag:hover .x, .tag.sel .x { display: block; }
  @media (hover: none) { .tag .x { display: block; } }
  @keyframes blink { 50% { opacity: .35; } }
  .drop.exact { border: 2px solid #2f9bff; }                                                                /* 人数がピッタリ揃ったとき：枠線に、青いライン */
  @keyframes blinkTag { 0% { border-color: #ff2b45; } 50% { border-color: #4a1219; } }
  .ghost { position: fixed; z-index: 99999; pointer-events: none; opacity: .9; transform: translate(-50%, -60%) scale(1.08); }
  .ghost.rot { transform: translate(-50%, -60%) rotate(90deg) scale(var(--gs, 1.08)); }
  /* 常用キャラ */
  .players { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-height: 120px; }
  .box h4 { margin: 0 0 6px; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
  .box h4 small { color: var(--sub); font-weight: 400; }
  .drop { min-height: 84px; border-radius: 8px; padding: 4px; background: rgba(255,255,255,.03); border: 1px dashed var(--line);
          display: flex; flex-wrap: wrap; gap: 5px; align-content: flex-start; }          /* 入れた名札は、横に並べる（入りきらなければ、次の段） */
  .drop.over { background: rgba(255,255,255,.12); border-color: #fff; }
  .drop.off { display: block; background: repeating-linear-gradient(45deg, #1a1f29, #1a1f29 8px, #141820 8px, #141820 16px); border-style: solid; color: var(--sub); font-size: 12px; text-align: center; padding-top: 28px; }
  .drop.empty::before { content: attr(data-hint); color: #5d6a82; font-size: 12px; align-self: center; }
  /* セット */
  #corners { display: flex; gap: 12px; flex-wrap: nowrap; }
  .corner { flex: 1 1 0; background: var(--panel); border: 2px solid; border-radius: 12px; padding: 8px 10px 10px; min-width: 0; }
  .corner.s { border-color: var(--s); } .corner.h { border-color: var(--h); }
  .corner > h3 { margin: 0 0 6px; font-size: 16px; }
  .corner.s > h3 { color: #7eb4ff; } .corner.h > h3 { color: #ff8896; }
  .blk { margin-top: 8px; }
  .blk h4 { margin: 0 0 4px; font-size: 13px; display: flex; gap: 8px; align-items: baseline; }
  .blk h4 small { color: var(--sub); font-weight: 400; font-size: 11px; }
  .blk h4 .cnt { margin-left: auto; font-weight: 400; color: var(--sub); font-size: 12px; }
  .blk h4 .cnt.over { color: #ff7a85; font-weight: 700; }
  .blk.gb .drop { background: rgba(160,120,255,.07); border-color: #6b57a8; }
  #memo { margin-top: 12px; }
  #memo textarea { width: 100%; min-height: 110px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; resize: vertical; }
  .hint { color: var(--sub); font-size: 12px; margin: 4px 0; }
  /* スマホを縦に持っているとき（画面を回して使うとき）は、縦の高さが少ないので、上の部分を小さくする */
  html.rot header { padding: 4px 12px 2px; gap: 8px; } html.rot header h1 { font-size: 15px; } html.rot header .sub { display: none; }
  html.rot nav { padding: 2px 12px; gap: 4px; } html.rot nav button { padding: 4px 10px; font-size: 12px; } html.rot #tabs2 button { font-size: 12px; padding: 3px 9px; }
  html.rot #notice { margin: 2px 12px; font-size: 12px; } html.rot #notice .bar { padding: 3px 8px; margin-bottom: 2px; }
  html.rot main { padding: 4px 12px 8px; gap: 8px; } html.rot #pal { flex-basis: 290px; padding: 6px; } html.rot #pal .hint { display: none; }
  html.rot .corner { padding: 6px 8px 8px; } html.rot .corner > h3 { margin-bottom: 2px; font-size: 14px; } html.rot .blk { margin-top: 4px; } html.rot .drop { min-height: 76px; }
  html.rot #memo textarea { min-height: 70px; }
  .empty-msg { color: var(--sub); padding: 30px; text-align: center; }
  /* ルール設定 */
  .rules .sec { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .rules h4 { margin: 0 0 6px; font-size: 14px; } .rules h5 { margin: 8px 0 4px; font-size: 13px; color: #9cc4ff; }
  .rules select, .rules input[type=text] { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: inherit; font-size: 13px; }
  .rules table { border-collapse: collapse; font-size: 13px; } .rules td, .rules th { padding: 3px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  .rules .ropt { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; cursor: pointer; }
  .rules .plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .rules .off { color: var(--sub); }
  .rules ul { margin: 4px 0 4px 18px; padding: 0; font-size: 13px; }
  #notice .newid { background: #3a2a10; border: 1px solid #ff9f1a; color: #ffd28a; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #notice .newid button, .btn { appearance: none; border: 1px solid #6f84ad; background: var(--panel2); color: var(--text); padding: 4px 12px; border-radius: 6px; font: inherit; font-size: 12px; cursor: pointer; }
  header .hbtn { margin-left: 6px; }
  #stage[hidden], #gate[hidden], #hist[hidden], #theme[hidden] { display: none; }
  #gate { position: fixed; inset: 0; overflow: auto; background: var(--bg); display: flex; align-items: flex-start; justify-content: center; padding: 24px 12px; z-index: 50; }
  #gate .card { width: min(560px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px 20px 16px; }
  #gate h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: .04em; } #gate .tm { color: var(--sub); margin-bottom: 12px; font-size: 14px; }
  #gate label { display: block; margin: 10px 0 4px; font-size: 13px; color: var(--sub); }
  #gate input[type=password], #gate input[type=text] { width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: inherit; font-size: 16px; }
  #gate .pw, #hist .pw { position: relative; } #gate .pw input, #hist .pw input { padding-right: 64px; width: 100%; }
  #hist .danger { margin-top: 18px; border: 1px solid #ff3b52; border-radius: 8px; padding: 6px 12px 12px; font-size: 12.5px; line-height: 1.6; color: #ffc9ce; }
  #hist .danger label { display: block; margin: 8px 0 4px; }
  #hist .danger .del { margin-top: 10px; background: #c0182d; color: #fff; border: 0; border-radius: 6px; padding: 7px 16px; cursor: pointer; font: inherit; font-weight: 700; }
  #hist .danger .del[disabled] { opacity: .5; cursor: wait; }
  #hist .danger .dmsg { margin-top: 8px; min-height: 16px; color: #ff9aa5; }
  #gate .eye, #hist .eye { position: absolute; top: 50%; right: 6px; transform: translateY(-50%); padding: 5px 10px; font-size: 13px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  #gate .welcome { color: var(--text); line-height: 1.7; margin: 10px 0 4px; } #gate .welcome b { font-size: 17px; } #gate .welcome .steps { margin-top: 8px; font-size: 14px; }
  #gate .consent h3 { margin: 14px 0 4px; font-size: 14px; color: var(--text); } #gate .consent div { font-size: 12.5px; line-height: 1.7; color: var(--text); margin: 2px 0; }
  #gate .consent .bul { padding-left: 1em; text-indent: -1em; } #gate .consent .links a { display: block; color: #8cc4ff; word-break: break-all; font-size: 12px; margin: 2px 0; }
  #gate .nogo { display: block; margin: 10px auto 0; opacity: .85; }
  #gate .go { margin-top: 14px; width: 100%; padding: 11px; font-size: 16px; font-weight: 700; background: #2f7be0; border: 0; color: #fff; border-radius: 8px; cursor: pointer; }
  #gate .go[disabled] { opacity: .5; cursor: wait; }
  #gate .warn { background: #4a1219; border: 1px solid #ff3b52; color: #ffc9ce; border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.6; margin: 10px 0; }
  #gate .warn b { color: #fff; }
  #gate .msg { margin-top: 10px; min-height: 18px; color: #ff9aa5; font-size: 13px; }
  #gate .opt { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--sub); }
  #gate .rules { font-size: 12px; color: var(--sub); margin-top: 4px; }
  #hist { position: fixed; inset: 0; z-index: 40; background: rgba(5,8,14,.86); overflow: auto; padding: 14px; }
  #hist .card { max-width: 900px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  #hist h2 { margin: 0 0 6px; font-size: 18px; } #hist h3 { margin: 14px 0 6px; font-size: 14px; color: var(--sub); }
  #hist table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  #hist td, #hist th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
  #hist th { color: var(--sub); font-weight: 600; }
  #hist .kv { color: #9cc4ff; } #hist .ke { color: #ffd98a; }
  #hist .note { font-size: 12.5px; line-height: 1.6; color: #ffc9ce; background: #4a1219; border: 1px solid #ff3b52; border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
  #hist .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; font-size: 13px; }
  #hist input { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
  /* ───────── デザイン：色（3色）と、スタイル（5種類）。LABごと。軽い動き（transform と opacity だけ） ───────── */
  #stage { overflow: hidden; }
  #stage > header, #stage > nav, #stage > #notice, #stage > main { position: relative; z-index: 1; }
  #stage::before, #stage::after { content: ""; position: absolute; pointer-events: none; display: none; z-index: 0; }
  #gate { background: radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--ac) 14%, var(--bg)), var(--bg) 62%); }
  nav button:hover, .btn:hover { border-color: var(--ac); }
  nav button.on { border-color: var(--ac); border-bottom-color: var(--panel2); box-shadow: inset 0 2px 0 var(--ac); }
  #gate .go { background: var(--ac); color: var(--ac-on); }
  #gate .card { border-color: color-mix(in srgb, var(--ac) 40%, var(--line)); }
  #theme { position: fixed; inset: 0; z-index: 41; background: rgba(0,0,0,.78); overflow: auto; padding: 14px; } #theme[hidden] { display: none; }
  #theme .card { max-width: 640px; margin: 0 auto; background: var(--panel); border: 1px solid color-mix(in srgb, var(--ac) 45%, var(--line)); border-radius: 12px; padding: 14px 16px; }
  #theme h2 { margin: 0 0 6px; font-size: 18px; } #theme h3 { margin: 16px 0 6px; font-size: 14px; color: var(--sub); }
  #theme .tnote { font-size: 12.5px; line-height: 1.6; background: color-mix(in srgb, var(--ac) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--ac) 50%, var(--line)); border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
  #theme .trow { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 14px; } #theme .tl { flex: 1; }
  #theme input[type=color] { width: 54px; height: 34px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }
  #theme .thx { font-family: Consolas, monospace; font-size: 12px; color: var(--sub); width: 64px; }
  #theme .styles { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
  #theme .styles button { padding: 12px 8px; font: inherit; font-size: 14px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  #theme .styles button.on { border-color: var(--ac); box-shadow: 0 0 0 1px var(--ac); background: color-mix(in srgb, var(--ac) 16%, var(--panel2)); font-weight: 700; }
  #theme .styles button small { display: block; font-size: 10.5px; color: var(--sub); font-weight: 400; margin-top: 2px; }
  #theme .trow2 { display: flex; gap: 8px; margin-top: 16px; }

  /* サイバー：ドット絵（ピクセル）の階段状の枠・ドットの格子・画面全体の走査線・ネオン。ゲームのような、角ばった見た目 */
  html[data-style="cyber"] body, html[data-style="cyber"] button, html[data-style="cyber"] input, html[data-style="cyber"] textarea, html[data-style="cyber"] select {
    font-family: "MS Gothic", "ＭＳ ゴシック", "Osaka-Mono", "DotGothic16", Consolas, "SF Mono", Menlo, "Hiragino Sans", "Yu Gothic", monospace; -webkit-font-smoothing: none; text-rendering: optimizeSpeed; }
  html[data-style="cyber"] header h1 { letter-spacing: .12em; color: var(--ac); animation: cy-flicker 7s infinite;
    text-shadow: 3px 3px 0 color-mix(in srgb, var(--ac) 35%, #000), 0 0 12px color-mix(in srgb, var(--ac) 55%, transparent); }
  html[data-style="cyber"] header h1::after { content: "_"; animation: cy-cursor 1s steps(1) infinite; }
  /* 枠：上下左右に、4pxの線を重ねる（角が欠けた、階段状の枠） */
  html[data-style="cyber"] #pal, html[data-style="cyber"] .box, html[data-style="cyber"] .rules .sec, html[data-style="cyber"] #hist .card, html[data-style="cyber"] #theme .card, html[data-style="cyber"] #gate .card {
    border: 0; border-radius: 0; clip-path: none;
    box-shadow: 0 -4px 0 0 color-mix(in srgb, var(--ac) 75%, var(--bg0)), 0 4px 0 0 color-mix(in srgb, var(--ac) 75%, var(--bg0)), -4px 0 0 0 color-mix(in srgb, var(--ac) 75%, var(--bg0)), 4px 0 0 0 color-mix(in srgb, var(--ac) 75%, var(--bg0)), 0 0 22px color-mix(in srgb, var(--ac) 22%, transparent), inset 0 0 0 2px color-mix(in srgb, var(--ac) 14%, transparent); }

      fillLb();
    } else if (cur.tab === "fav") {
      PLAYERS.forEach(function (p) {
        var d = document.querySelector('[data-drop="fav:' + p.id + '"]');
        if (!d) return;
        d.textContent = "";
        var ids = Object.keys(obj(obj(STATE.fav)[p.id])).map(Number).filter(function (id) { return CH[id]; });
        ids.sort(function (a, b) { return (CH[a].f === CH[b].f ? 0 : CH[a].f === "h" ? -1 : 1) || a - b; });
        d.classList.toggle("empty", !ids.length);
        ids.forEach(function (id) {
          var t = makeTag(CH[id], { onRemove: function () { var o = {}; o["fav/" + p.id + "/" + id] = null; write(o); } });
          if (sel && sel.id === id && sel.from.spec === "fav:" + p.id) t.classList.add("sel");
          attachTag(t, CH[id], { kind: "blk", spec: "fav:" + p.id });
          d.appendChild(t);
        });
      });
    } else {
      var s = curSet();
      if (s) {
        var req = reqIds(), lb = lbIds(), st = setState(), rd = curRound();
        var gbv = {};
        ["s", "h"].forEach(function (f) { gbv[f] = {}; globalList(f, rd, s).forEach(function (id) { gbv[f][id] = true; }); });
        var hard = {};                                                                  // ぜったい必須のキャラ（組の必須ではないもの）
        ["h", "s"].forEach(function (f) { ((s.req && s.req[f]) || []).forEach(function (r) { if (!r.g) hard[r.id] = true; }); });
        [["s"], ["h"]].forEach(function (fa) {
          var f = fa[0];
          ["ban", "pick"].forEach(function (b) {
            var d = $("blk-" + f + "-" + b);
            if (!d) return;
            var cap = capOf(s, f, b);
            if (cap === 0) return;                                                      // できない枠：そのまま
            var want = blockFaction(f, b);                                              // この枠に入るキャラの陣営
            var auto = Object.keys(b === "pick" ? hard : lb).map(Number).filter(function (id) { return CH[id] && CH[id].f === want; });
            var manual = Object.keys(obj(obj(st[f])[b])).map(Number).filter(function (id) { return CH[id] && auto.indexOf(id) < 0; });
            var counted = manual.length + (b === "pick" ? auto.length : 0);               // ローカルBANは、BANの人数には、数えない（別のカウント）
            d.textContent = "";
            d.classList.toggle("empty", !manual.length && !auto.length);
            d.classList.toggle("exact", counted === cap);                                 // 人数がピッタリ揃った：枠線に、青いライン
            auto.forEach(function (id) { d.appendChild(makeTag(CH[id], { locked: true, req: !!req[id], bad: b === "pick" && !!gbv[f][id] })); });      // 自動で入ったもの（外せない）
            manual.forEach(function (id) {
              var spec = "set:" + f + ":" + b;
              var isBad = b === "pick" ? !!gbv[f][id] : !!lb[id];                // PICKは使えないキャラだと、警告
              var t = makeTag(CH[id], { req: !!req[id], bad: isBad, onRemove: function () { var o = {}; o[dropPath(spec) + "/" + id] = null; write(o); } });
              if (sel && sel.id === id && sel.from.spec === spec) t.classList.add("sel");
              attachTag(t, CH[id], { kind: "blk", spec: spec });
              d.appendChild(t);
            });
            var c = $("cnt-" + f + "-" + b);
            if (c) { c.textContent = counted + " / " + cap + (b === "ban" && auto.length ? "（＋ローカルBAN " + auto.length + "）" : ""); c.className = "cnt" + (counted > cap ? " over" : ""); }
          });
          var g = $("blk-" + f + "-gb");
          if (g) {
            g.textContent = "";
            var gl = globalList(f, rd, s);                                              // 前のセットで使ったキャラ（ローカルBANは、BANの枠に入るので、ここには出さない）
            g.classList.toggle("empty", !gl.length);
            gl.forEach(function (id) {
              var o2 = { locked: true };
              if (editableGb()) o2.onRemove = function () {
                var o = {}, auto = globalBase(f, rd, s).indexOf(id) >= 0;
                o["rules/gbx/" + rd.no + "_" + s.k + "/" + f + "/" + id] = auto ? 0 : null; write(o);
              };
              g.appendChild(makeTag(CH[id], o2));
            });
          }
        });
        var ta = $("memoText");
        if (ta) { var v = String(obj(st).memo || ""); if (document.activeElement !== ta && ta.value !== v) ta.value = v; }
      }
    }
    showNotice();
  }
  function showNotice() {
    var n = $("notice"); n.textContent = "";
    var flashMsg = n.getAttribute("data-flash");
    if (flashMsg) n.appendChild(el("div", "bar err", flashMsg));
    if (writeFailed) n.appendChild(el("div", "bar err", "保存できませんでした（通信が切れている、または Firebase のルールの設定が違います）。管理者に伝えてください。"));
    var fresh = newIds();
    if (fresh.length) {                                                                // 知らない端末が、開きました
      var bar = el("div", "bar newid");
      bar.appendChild(el("span", "", "⚠ 知らない端末のアクセスがあります：" + fresh.slice(0, 4).map(function (h) { return (h.n || "?") + "（ID " + h.cid.slice(0, 6) + "）" + fmtTime(h.t); }).join("、")
        + (fresh.length > 4 ? " ほか" : "") + "。チームの人でなければ、すぐにチームの管理者に知らせてください。"));
      var ok = el("button", "", "確認した");
      ok.type = "button";
      ok.addEventListener("click", function () { var s = seenList(); fresh.forEach(function (h) { if (s.indexOf(h.cid) < 0) s.push(h.cid); }); saveSeen(s); showNotice(); });
      bar.appendChild(ok);
      var hb = el("button", "", "履歴を見る"); hb.type = "button"; hb.addEventListener("click", openHist); bar.appendChild(hb);
      n.appendChild(bar);
    }
  }

  // ───────── 読み込み ─────────
  function onMeta(m) {
    if (!m) { if (!META) setStatus("データを待っています…（準備ができると表示されます）", ""); return; }
    RAWMETA = m;
    applyTheme();
    applyMeta();
    $("ttl").textContent = "🧪 IDV TEAM LAB｜" + (m.team || "");
    $("sub").textContent = m.tour || "";
    document.title = "IDV TEAM LAB｜" + (m.team || "");
    if (FIRST_META) { FIRST_META = false; if (FREE && !savedTab) cur = { tab: "rules", set: "1" }; }              // 大会BOTを使わないチームは、最初は、ルール設定から
    if (isRoundTab() && !curRound()) cur = { tab: FREE ? "rules" : "fav", set: "1" };
    if (isRoundTab() && !curSet()) cur.set = (curRound().sets[0] || {}).k;
    var memoFocused = document.activeElement && document.activeElement.id === "memoText";
    if (memoFocused) { buildTabs(); buildPalette(); fill(); } else buildAll();
  }
  var savedTab = false;
  try { var saved = JSON.parse(sessionStorage.getItem("lab_tab_" + ID) || "null"); if (saved && saved.tab) { cur = saved; savedTab = true; } } catch (e) { /* 無視 */ }
  function getJson(u) { return fetch(u, { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); }
  function start() {
    Promise.all([getJson(ASSET + "face_positions.json"), getJson(ASSET + "assets/face_positions.json")]).then(function (r) {
      FACES = (r[0] && r[0].faces) || (r[1] && r[1].faces) || {};
    }).then(boot);
  }

  // ───────── 同意の画面（チーム名・パスワード・ログインの前に、かならず1回。同意するまで、Firebaseへの通信は、しない） ─────────
  var CONSENT_KEY = "lab_consent_v2", sessionConsent = false;
  function hasConsent() { try { return localStorage.getItem(CONSENT_KEY) === "1"; } catch (e) { return sessionConsent; } }
  function giveConsent() { sessionConsent = true; try { localStorage.setItem(CONSENT_KEY, "1"); } catch (e) { /* 無視 */ } }
  var POLICY = [                                                              // 同意の画面の文章。「p」＝文章、「b」＝箇条書き、「l」＝リンク
    ["", [
      ["b", "当サイトでは、絶対に個人情報を入力しないでください。"],
      ["b", "登録された作戦と履歴の内容は暗号化して保存されます。"],
      ["b", "LABへのログイン時には、名前・端末の種類・ブラウザごとに作られたランダムなID・操作の内容と時刻が履歴に残ります。IDは、同じブラウザかどうかを見分けるためのランダムな番号で、個人を特定するものではありません。操作の内容は暗号化されていて、パスワードを知るチームのメンバーだけが見られます。「いつ」操作されたか（時刻と件数）は暗号化されず、開発者も確認できます（サイト管理のために必要です）。"],
      ["b", "LABのURLとパスワードは大切に保管し、信頼できる人物にのみ共有してください。"],
      ["b", "URLとパスワードが流出してしまった場合は、LABを削除して作戦と履歴のデータを削除できます。その後、新しいLABを作成してください。"]]]
  ];
  function showConsent() {
    gate(function (c) {
      brand(c, "ご利用の前に");
      var box = el("div", "consent");
      POLICY.forEach(function (sec) {
        if (sec[0]) box.appendChild(el("h3", "", sec[0]));
        sec[1].forEach(function (it) {
          if (it[0] === "l") {
            var d = el("div", "links");
            it[1].forEach(function (lk) { var a = el("a", "", lk[0] + "：" + lk[1]); a.href = lk[1]; a.target = "_blank"; a.rel = "noopener noreferrer"; d.appendChild(a); });
            box.appendChild(d);
          } else box.appendChild(el("div", it[0] === "b" ? "bul" : "", (it[0] === "b" ? "・" : "") + it[1]));
        });
      });
      c.appendChild(box);
      var m = msgBox(c);
      var go = el("button", "go", "同意して進む"); go.type = "button"; c.appendChild(go);
      var no = el("button", "btn nogo", "同意しない"); no.type = "button"; c.appendChild(no);
      go.addEventListener("click", function () { giveConsent(); $("gate").hidden = true; start(); });
      no.addEventListener("click", function () { m.textContent = "同意いただけない場合はこのLABはご利用になれません。このタブを閉じてください。"; });
    });
  }
  if (hasConsent()) start(); else showConsent();
})();
</script>
</body>
