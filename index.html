<html lang="ja" data-style="cyber" data-tone="dark">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https://mitaraiasobu.github.io data:; connect-src https://idv-team-lab-default-rtdb.asia-southeast1.firebasedatabase.app https://mitaraiasobu.github.io; base-uri 'none'; form-action 'none'">

<title>IDV TEAM LAB</title>
<!-- IDV TEAM LAB：チームだけで使う、試合前の作戦ボード（みんなで同時に編集できる）。大会BOTとは別のサイト。
     ・URLの # のあとの文字（チームごとのランダムな24文字）を知っている人だけが、このチームの場所を開ける。
     ・開くには、チームで決めた「パスワード」が要る。パスワードは、ブラウザの中だけで使い、どこにも送らない・保存しない（GitHubにも、Firebaseにも、入らない）。
     ・作戦の中身は、パスワードから作った鍵で、ブラウザの中で暗号化（AES-256-GCM）してから、Firebaseに送る。Firebaseに置かれるのは暗号文だけなので、パスワードを知らない人は、読めない。
     ・履歴（訪問・編集）は、追記だけで、消せない・書き換えられない（Firebaseのルール）。端末ごとのID（ブラウザに作る）が入るので、知らない端末が開くと、お知らせが出る。
     ・パスワードは、最初に1回だけ決める（英大文字・小文字・数字、10〜20文字）。あとから変えることはできない。
     ・キャラの顔の画像は、大会のページ（window.LAB_ASSET_BASE）のものを読む。
     ・中身（キャラ・名札・ドラッグ・職業の並び替え・スマホの回転）は、大会BOTの作戦ボードと同じ。 -->
<style>
  :root { --bg0: #05070b; --fg0: #f2f6ff; --ac: #22d3ee; --ac-on: #03121a;                          /* LABごとに変えられる3色：背景・文字・サブカラー */
          --bg: var(--bg0); --text: var(--fg0);
          --panel: color-mix(in srgb, var(--bg0) 91%, var(--fg0)); --panel2: color-mix(in srgb, var(--bg0) 83%, var(--fg0));
          --line: color-mix(in srgb, var(--bg0) 70%, var(--fg0)); --sub: color-mix(in srgb, var(--fg0) 62%, var(--bg0));
          --h: #d8334a; --h2: #7d1b29; --s: #2f7be0; --s2: #173d73; --gold: #ffd23f; --ok: #3ecf8e; }   /* ハンターの赤・サバイバーの青は、固定 */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif; }
  #stage { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: flex; flex-direction: column; transform-origin: 0 0; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding: 10px 16px 6px; }
  header h1 { margin: 0; font-size: 20px; }
  header .sub { color: var(--sub); font-size: 13px; }
  #status { margin-left: auto; font-size: 12px; color: var(--sub); }
  #status.ok { color: var(--ok); } #status.ng { color: #ff7a85; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 16px; }
  nav button { appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 7px 14px; border-radius: 8px 8px 0 0;
               font: inherit; font-size: 14px; cursor: pointer; }
  nav button.on { background: var(--panel2); border-color: #6f84ad; border-bottom-color: var(--panel2); font-weight: 700; }
  #tabs2 button { font-size: 13px; padding: 5px 12px; }
  #simbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; padding: 0; }                    /* セット表示と同じ列の、右端 */
  #simbar[hidden] { display: none; }
  #simbar button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); cursor: pointer; }
  #simbar button.simgo { background: var(--gold); border-color: var(--gold); color: #05070b; font-weight: 700; }
  #simbar .simhint { font-size: 12px; color: var(--sub); } #simbar .simlabel { font-size: 14px; font-weight: 700; color: var(--gold); }
  .tag.m { border-color: var(--gold); background: linear-gradient(180deg, #3a3210, #6a5a14); cursor: pointer; }
  .tag.m .face { font-size: 12px; padding: 2px; line-height: 1.1; text-align: center; word-break: break-all; }
  .tag.m.sel { box-shadow: 0 0 0 3px var(--gold), 0 0 14px 3px rgba(255, 210, 63, .8); }
  .mslot { display: inline-flex; min-width: 66px; min-height: 60px; align-items: center; justify-content: center; border: 2px dashed var(--line); border-radius: 8px; cursor: pointer; vertical-align: middle; }
  .mslot .ph { color: var(--sub); font-size: 20px; } .mslot.armed { border-color: var(--gold); background: rgba(255, 210, 63, .08); }
  .simnow.mslot, label.simnow .mslot { border-color: var(--gold); }
  .simfuture { opacity: .12; filter: grayscale(1); transition: opacity .35s, filter .35s; }
  .simnow.tag { box-shadow: 0 0 0 3px var(--gold), 0 0 18px 6px rgba(255, 210, 63, .9); transform: translateY(-3px) scale(1.06); z-index: 5; animation: simpulse 1.1s ease-in-out infinite; }
  .simnow.frame, .simnow.drop { border-color: var(--gold); border-style: solid; box-shadow: 0 0 14px 3px rgba(255, 210, 63, .7); animation: simpulse 1.1s ease-in-out infinite; }
  .simnow.msel, label.simnow { color: var(--gold); text-shadow: 0 0 8px rgba(255, 210, 63, .9); }
  @keyframes simpulse { 50% { filter: brightness(1.35); } }
  #notice { margin: 4px 16px; font-size: 13px; }
  #notice .bar { padding: 6px 10px; border-radius: 6px; margin-bottom: 4px; }
  #notice .bad { background: #4a1219; border: 1px solid #ff3b52; color: #ffb3bb; animation: blink 1s steps(2, start) infinite; }
  #notice .req { background: #4a3d0a; border: 1px solid var(--gold); color: #ffe48a; }
  #notice .err { background: #3a2a10; border: 1px solid #e0a030; color: #ffd28a; }
  main { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 8px 16px 12px; align-items: stretch; }
  #pal { flex: 0 0 330px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  #pal.drop-ok { outline: 2px dashed var(--sub); }
  #pal h3 { margin: 0 2px; font-size: 13px; color: var(--sub); flex: none; }
  .palhd { appearance: none; flex: none; background: none; border: 0; color: var(--sub); font: inherit; font-size: 13px; font-weight: 700; margin: 0 2px; padding: 2px 4px; cursor: pointer; text-align: left; }
  .palhd:hover { color: var(--text); } .palbox.collapsed { display: none; }
  #pal input { width: 100%; flex: none; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 13px; }
  #pal .hint { flex: none; margin: 0; }
  .palbox { flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; touch-action: none; scrollbar-width: none; }
  .palbox::-webkit-scrollbar { display: none; }
  * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--ac) 65%, var(--bg0)) transparent; }                      /* スクロールバーは、デザインの色（サブカラー）に合わせる */
  *::-webkit-scrollbar { width: 9px; height: 9px; } *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--ac) 65%, var(--bg0)); border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
  *::-webkit-scrollbar-thumb:hover { background: var(--ac); background-clip: padding-box; }
  html[data-style="cyber"] *::-webkit-scrollbar-thumb, html[data-style="rock"] *::-webkit-scrollbar-thumb { border-radius: 0; }                                      /* スクロールバーは見せない（ホイール・指のスクロールは、できる） */     /* ハンターの名札置き場と、サバイバーの名札置き場は、別々にスクロール */
  .palbox.h { border-top: 2px solid var(--h); } .palbox.s { border-top: 2px solid var(--s); }
  .palopt { flex: none; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sub); margin: 0 2px; cursor: pointer; user-select: none; }
  #pal .palopt input { width: auto; flex: none; padding: 0; accent-color: var(--s); }
  .palopt { white-space: nowrap; }
  .rolehd { margin: 6px 2px 3px; font-size: 12px; font-weight: 700; color: #9cc4ff; border-bottom: 1px solid var(--s2); }
  .rolehd:first-child { margin-top: 0; }
  #work { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; padding-bottom: 20px; }
  .grid { display: flex; flex-wrap: wrap; gap: 5px; }
  /* 名札：顔 + 名前 を、枠で囲む。ハンターは赤、サバイバーは青 */
  .tag { width: 66px; border: 2px solid; border-radius: 8px; padding: 3px 2px 2px; text-align: center; cursor: grab; user-select: none; -webkit-user-select: none;
         touch-action: pan-y; position: relative; background: var(--panel2); }
  .tag.h { border-color: var(--h); background: linear-gradient(180deg, #3a1219, var(--h2)); }
  .tag.s { border-color: var(--s); background: linear-gradient(180deg, #11274a, var(--s2)); }
  .tag .face { width: 56px; height: 56px; margin: 0 auto; border-radius: 6px; background-repeat: no-repeat; background-color: rgba(0,0,0,.35);
               display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .tag .nm { font-size: 10.5px; line-height: 1.15; margin-top: 2px; word-break: break-all; min-height: 24px; display: flex; align-items: center; justify-content: center; }
  .tag .rms { position: absolute; top: 17px; right: 3px; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; z-index: 2; }       /* 縦に並べる */
  .tag .rms span { font-size: 10px; line-height: 1; padding: 1px; border-radius: 8px; background: rgba(0, 0, 0, .6); color: #fff; }
  .tag.fav.h { background: linear-gradient(180deg, #5a1d29, #a02a3d); border-color: #ff5e75; }                /* 誰かの得意キャラ：少しだけ明るく */
  .tag.fav.s { background: linear-gradient(180deg, #1c3f73, #2b62b0); border-color: #5ca2ff; }
  .tag .fstar { position: absolute; top: 1px; left: 3px; font-size: 13px; line-height: 1; color: var(--gold); text-shadow: 0 0 3px #000, 0 1px 0 #000; z-index: 2; pointer-events: none; }
  .tag { -webkit-touch-callout: none; }
  html.rot .tag { touch-action: pan-x; }                                             /* 回して表示しているとき：画面の縦（実際の横方向）に指を動かすと、名札の上でもスクロールできる */
  .tag.gray { filter: grayscale(1) brightness(.8); opacity: .7; }                                    /* 組み合わせ禁止で、選べない／選べなくなったキャラ */
  .pn.s { color: #6fb0ff; } .pn.h { color: #ff7d8d; } .pn.sh { color: #c79bff; }                    /* 選手名：サバイバー応募＝青／ハンター応募＝赤／両方＝紫 */
  html[data-tone="light"] .pn.s { color: #1f5fb4; } html[data-tone="light"] .pn.h { color: #c3213a; } html[data-tone="light"] .pn.sh { color: #7b3fc4; }
  #pcNote { position: fixed; left: 8px; right: 8px; top: 8px; z-index: 100001; background: var(--panel); color: var(--text); border: 2px solid var(--ac); border-radius: 10px; padding: 10px 14px; font-size: 3.4vw; line-height: 1.6; box-shadow: 0 6px 24px rgba(0, 0, 0, .6); }
  #pcNote b { display: block; margin-bottom: 4px; } #pcNote .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; } #pcNote .btn { font-size: 3vw; }
  #whyPop { position: fixed; z-index: 100000; max-width: 290px; background: var(--panel); color: var(--text); border: 1px solid var(--ac); border-radius: 10px; padding: 8px 12px 9px; font-size: 12.5px; line-height: 1.6; box-shadow: 0 6px 22px rgba(0,0,0,.5); }
  #whyPop b { display: block; margin-bottom: 2px; font-size: 13px; } #whyPop div + div { margin-top: 3px; }
  #gate .who { display: flex; align-items: baseline; gap: 10px; width: 100%; margin: 6px 0; padding: 11px 12px; text-align: left; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 15px; cursor: pointer; }
  #gate .who:hover { border-color: var(--ac); } #gate .who .tg { font-size: 11px; color: var(--sub); margin-left: auto; }
  .tag.hl { box-shadow: 0 0 0 3px var(--gold), 0 0 16px 4px rgba(255, 210, 63, .85); transform: translateY(-2px); }              /* 空のスロットをクリックした選手の、得意キャラ */
  .tag.insL { box-shadow: 0 -5px 0 var(--ac); } .tag.insR { box-shadow: 0 5px 0 var(--ac); }                                         /* 入れる場所の目印（縦の枠：上／下） */
  .drop:not(.col) .tag.insL { box-shadow: -5px 0 0 var(--ac); } .drop:not(.col) .tag.insR { box-shadow: 5px 0 0 var(--ac); }
  .slotctl { margin-left: 8px; font-weight: 400; font-size: 12px; color: var(--sub); display: inline-flex; align-items: center; gap: 4px; }
  .slotctl .sn { color: var(--text); font-size: 13px; }
  .sbtn { appearance: none; border: 1px solid var(--line); background: var(--panel2); color: var(--text); border-radius: 6px; width: 24px; height: 22px; line-height: 1; font-size: 14px; cursor: pointer; padding: 0; }
  .sbtn:hover { border-color: var(--ac); }
  .pbar { display: flex; justify-content: center; align-items: center; gap: 3px; min-height: 30px; width: 100%; cursor: pointer; margin-top: 2px; }
  .pbar img { width: 30px; height: 30px; object-fit: contain; } .pbar .padd { font-size: 10px; color: var(--sub); opacity: .55; }
  .pbar:hover .padd { opacity: 1; color: var(--ac); }
  .pmod { position: absolute; inset: 0; z-index: 60; background: rgba(0, 0, 0, .55); display: flex; align-items: center; justify-content: center; }
  .pcard { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; max-width: 94%; width: 600px; display: flex; flex-direction: column; gap: 10px; }
  .pcard .pt { font-weight: 800; font-size: 16px; } .pcard .pn { font-size: 12px; color: var(--sub); } .pcard .pwhy { font-size: 12px; color: var(--gold); }
  .pgr2 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .pbtn { display: flex; align-items: center; justify-content: center; padding: 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); cursor: pointer; }
  .pbtn.on { border-color: var(--gold); box-shadow: 0 0 10px rgba(255, 210, 63, .6); } .pbtn img { width: 100%; max-width: 120px; aspect-ratio: 1; object-fit: contain; }
  .sbtn.txt { width: auto; padding: 0 8px; font-size: 12px; } .sbtn.arm { border-color: var(--gold); color: var(--gold); } .sbtn[disabled] { opacity: .35; cursor: default; }
  .cellw { display: flex; flex-direction: column; gap: 3px; min-width: 0; } .cellw .psel { width: 100%; }
  .rowctl { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 0 4px; } .rowctl .rn { font-size: 11px; color: var(--sub); white-space: nowrap; } .rowctl .rg { font-size: 16px; color: var(--gold); }
  .edithint { font-size: 12px; color: var(--gold); padding: 2px 4px; }
  .pgrid.edit > [data-row] { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: grab; position: relative; }
  .pgrid.edit .cellw > *, .pgrid.edit .tag, .pgrid.edit .pbar, .pgrid.edit .gbrow * { pointer-events: none; }                      /* 編集中は、名札・人格・選手名・枠は、さわれない（行ごと、つかむ） */
  .pgrid.edit > .rdrag { z-index: 20; opacity: .9; cursor: grabbing; outline: 2px solid var(--gold); background: rgba(255, 210, 63, .12); }
  .pgrid.edit > .rtarget { outline: 2px dashed var(--gold); }
  .pgrid { display: grid; gap: 6px; align-items: start; overflow-x: auto; }                                                       /* 選手の縦列（必ず横に並ぶ）× 編成パターンの行（増やすと、下へ増える） */
  .pgrid .psel, .pgrid .pname { width: 100%; font: inherit; font-size: 12px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 4px; text-align: center; }
  .pgrid .pname { color: var(--sub); background: none; border-style: dashed; }
  .drop.cell { min-height: 84px; justify-content: center; }
  .tag[data-num]::after, .drop.cell[data-num]::after, .frame::after { content: attr(data-num); position: absolute; top: -1px; right: 3px; z-index: 4; font-size: 14px; font-weight: 800; line-height: 1; color: var(--gold); text-shadow: 0 0 3px #000, 0 0 3px #000; pointer-events: none; }
  .drop.cell { position: relative; }
  .frame { position: relative; width: 66px; min-height: 78px; border: 2px dashed var(--line); border-radius: 8px; opacity: .8; flex: none; }
  .mapbar { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 4px 0 6px; font-size: 12.5px; }
  .mapbar label { display: inline-flex; align-items: center; gap: 6px; color: var(--sub); } .mapbar select { font: inherit; font-size: 12.5px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  .gbrow { display: flex; flex-wrap: wrap; gap: 3px; margin: -2px 0 4px; } .gbrow[hidden] { display: none; }
  .gbface { width: 26px; height: 26px; border-radius: 4px; background-repeat: no-repeat; background-color: rgba(0,0,0,.35); filter: grayscale(1) brightness(.85); flex: none; cursor: pointer; }
  .drop.col { flex-direction: column; flex-wrap: nowrap; align-items: center; min-height: 100px; }                                      /* キャラは、縦に並ぶ */
  .tag.sel { outline: 3px solid #fff; }
  .ghost .gcount { position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); background: var(--ac); color: var(--ac-on); font-size: 12px; font-weight: 800; padding: 1px 8px; border-radius: 10px; }
  .tag.req { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold), 0 0 12px 2px rgba(255,210,63,.75); }
  .tag.req .nm { color: var(--gold); font-weight: 700; }
  .tag.bad { border-color: #ff2b45; animation: blinkTag 4s step-end infinite; }                    /* 使用禁止：枠線だけ、ゆっくり点滅（フェードなし） */
  .tag.locked { cursor: default; opacity: .92; }
  .tag.dim { opacity: .35; }
  .tag .x { position: absolute; right: -6px; top: -7px; width: 18px; height: 18px; line-height: 16px; border-radius: 50%; background: #000; color: #fff; border: 1px solid #888;
            font-size: 11px; padding: 0; cursor: pointer; display: none; }
  .tag:hover .x, .tag.sel .x { display: block; }
  @media (hover: none) { .tag .x { display: block; } }
  @keyframes blink { 50% { opacity: .35; } }
  .drop.exact { border: 2px solid #2f9bff; }                                                                /* 人数がピッタリ揃ったとき：枠線に、青いライン */
  @keyframes blinkTag { 0% { border-color: #ff2b45; } 50% { border-color: #4a1219; } }
  .ghost { position: fixed; z-index: 99999; pointer-events: none; opacity: .9; transform: translate(-50%, -60%) scale(1.08); }
  .ghost.rot { transform: translate(-50%, -60%) rotate(90deg) scale(var(--gs, 1.08)); }
  /* 常用キャラ */
  .players { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-height: 120px; }
  .box h4 { margin: 0 0 6px; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
  .box h4 small { color: var(--sub); font-weight: 400; }
  .drop { min-height: 84px; border-radius: 8px; padding: 4px; background: rgba(255,255,255,.03); border: 1px dashed var(--line);
          display: flex; flex-wrap: wrap; gap: 5px; align-content: flex-start; }          /* 入れた名札は、横に並べる（入りきらなければ、次の段） */
  .drop.over { background: rgba(255,255,255,.12); border-color: #fff; }
  .drop.off { display: block; background: repeating-linear-gradient(45deg, #1a1f29, #1a1f29 8px, #141820 8px, #141820 16px); border-style: solid; color: var(--sub); font-size: 12px; text-align: center; padding-top: 28px; }
  .drop.empty::before { content: attr(data-hint); color: #5d6a82; font-size: 12px; align-self: center; }
  /* セット */
  #corners { display: flex; flex-direction: column; gap: 12px; }                  /* 上：サバイバー目線／下：ハンター目線 */
  .corner { background: var(--panel); border: 2px solid; border-radius: 12px; padding: 8px 10px 10px; min-width: 0; }
  .corner .chd { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; } .corner .chd > h3 { margin: 0; } .swapbtn { margin-left: auto; }
  .pair { display: flex; gap: 12px; align-items: stretch; } .pair.swap { flex-direction: row-reverse; }      /* 左：自陣営／右：敵陣営（ハンター目線は入れ替えられる） */
  .side { flex: 1 1 0; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 4px 8px 8px; background: color-mix(in srgb, var(--bg0) 55%, var(--panel)); }
  .side.enemy { border-style: dashed; } .side > h5 { margin: 2px 0 0; font-size: 12px; color: var(--sub); letter-spacing: .08em; }

      ["b", "URLとパスワードが流出してしまった場合は、LABを削除して作戦と履歴のデータを削除できます。その後、新しいLABを作成してください。"]]]
  ];
  function showConsent() {
    gate(function (c) {
      brand(c, "ご利用の前に");
      var box = el("div", "consent");
      POLICY.forEach(function (sec) {
        if (sec[0]) box.appendChild(el("h3", "", sec[0]));
        sec[1].forEach(function (it) {
          if (it[0] === "l") {
            var d = el("div", "links");
            it[1].forEach(function (lk) { var a = el("a", "", lk[0] + "：" + lk[1]); a.href = lk[1]; a.target = "_blank"; a.rel = "noopener noreferrer"; d.appendChild(a); });
            box.appendChild(d);
          } else box.appendChild(el("div", it[0] === "b" ? "bul" : "", (it[0] === "b" ? "・" : "") + it[1]));
        });
      });
      c.appendChild(box);
      var m = msgBox(c);
      var go = el("button", "go", "同意して進む"); go.type = "button"; c.appendChild(go);
      var no = el("button", "btn nogo", "同意しない"); no.type = "button"; c.appendChild(no);
      go.addEventListener("click", function () { giveConsent(); $("gate").hidden = true; start(); });
      no.addEventListener("click", function () { m.textContent = "同意いただけない場合はこのLABはご利用になれません。このタブを閉じてください。"; });
    });
  }
  if (hasConsent()) start(); else showConsent();
})();
</script>
